spring.application.name=Java_Project
# Database Connection URL
spring.datasource.url=jdbc:mysql://localhost:3306/Javasem
spring.datasource.username=root
spring.datasource.password=1234

# Hibernate configuration to automatically create/update tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Required: Makes Spring throw NoHandlerFoundException (404) so GlobalExceptionHandler can catch it
# instead of returning Spring's default white-label error page
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
