<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grievance Management System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Public Grievances</h1>
            <p>Submit and track civic issues in your area.</p>
        </header>

        <main>
            <!-- Submit Grievance Section -->
            <section class="glass-panel form-section">
                <h2>Submit a Grievance</h2>
                <form id="grievanceForm">
                    <div class="input-group">
                        <label for="categoryId">Category ID</label>
                        <input type="number" id="categoryId" placeholder="e.g. 1 for Infrastructure" required>
                    </div>
                    <div class="input-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="4" placeholder="Describe the issue in detail..." required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Submit Grievance</button>
                </form>
                <div id="submitMessage" class="hidden"></div>
            </section>

            <!-- List Grievances Section -->
            <section class="glass-panel list-section">
                <div class="section-header">
                    <h2>Recent Grievances</h2>
                    <button id="refreshBtn" class="btn-secondary">Refresh</button>
                </div>
                <div id="grievanceList" class="grievance-grid">
                    <!-- Grievance cards will be injected here via JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
